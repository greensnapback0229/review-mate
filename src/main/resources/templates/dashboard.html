<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Dashboard</title></head>
<body>
<div layout:fragment="content">
    <h2 class="mb-4">Dashboard</h2>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">
                환영합니다, <span th:text="${user.githubLogin}">user</span>님!
            </h5>
            <p class="card-text text-muted">
                AI 기반 코드 리뷰 서비스입니다. GitHub App을 설치하고 Repository를 연결하면 PR 리뷰를 자동으로 받을 수 있습니다.
            </p>
            <div class="d-flex gap-2">
                <a href="/settings/api-key" class="btn btn-primary">
                    <i class="bi bi-key"></i> API Key 설정
                </a>
                <a href="/profile" class="btn btn-outline-secondary">
                    <i class="bi bi-person"></i> 프로필
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
