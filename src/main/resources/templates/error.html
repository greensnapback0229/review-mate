<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - PR Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5 text-center">
    <h1 class="display-1 text-danger">
        <i class="bi bi-exclamation-triangle"></i>
    </h1>
    <h2 th:text="${status} ?: 'Error'">500</h2>
    <p class="text-muted" th:text="${message} ?: '예상하지 못한 오류가 발생했습니다.'">Something went wrong</p>
    <a href="/dashboard" class="btn btn-primary mt-3">홈으로 돌아가기</a>
</div>
</body>
</html>
